# MoeBuilds Agent Pipeline
#
# Webhook triggers (builder / auditor / qa)
# ──────────────────────────────────────────
# These jobs fire via GitHub's repository_dispatch API, which Supabase
# Database Webhooks call whenever a row changes status.
#
# Set up three webhooks in Supabase → Database → Webhooks:
#
#   1. Table: clients | Event: INSERT | Filter: status = 'new'
#      POST https://api.github.com/repos/masterchiefdevelopment/MoeBuilds-systems/dispatches
#      Headers: Authorization: Bearer <GH_PAT>, Content-Type: application/json
#      Body: { "event_type": "client-new", "client_payload": { "client_id": "{{NEW.id}}" } }
#
#   2. Table: clients | Event: UPDATE | Filter: status = 'auditing'
#      Body: { "event_type": "client-auditing" }
#
#   3. Table: clients | Event: UPDATE | Filter: status = 'qa'
#      Body: { "event_type": "client-qa" }
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY, ANTHROPIC_API_KEY,
#   RESEND_API_KEY, GH_PAT (Personal Access Token — needed for
#   cross-repo operations in builder/auditor), GH_OWNER, GH_REPO

name: MoeBuilds Agent Pipeline

on:
  repository_dispatch:
    types: [client-new, client-auditing, client-qa]
  schedule:
    - cron: '0 0 * * *'    # security.js  — daily at midnight UTC
    - cron: '0 8 * * 1'    # analyst.js   — every Monday at 08:00 UTC

# ── Builder ──────────────────────────────────────────────────────────────────
# Fires when Supabase inserts a new client row (status = 'new').
# The webhook must include client_payload.client_id.
jobs:
  builder:
    name: Builder Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'client-new'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Builder Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/builder.js ${{ github.event.client_payload.client_id }}

# ── Auditor ───────────────────────────────────────────────────────────────────
# Fires when a client's status changes to 'auditing'.
# Reads the oldest auditing record from the queue — no client_id needed.
  auditor:
    name: Auditor Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'client-auditing'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auditor Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/auditor.js

# ── QA ────────────────────────────────────────────────────────────────────────
# Fires when a client's status changes to 'qa'.
# Reads the oldest qa record from the queue — no client_id needed.
  qa:
    name: QA Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'client-qa'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run QA Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/qa.js

# ── Security ──────────────────────────────────────────────────────────────────
# Runs daily at midnight UTC.
# Probes all delivered client URLs with Playwright and checks for stuck agents.
  security:
    name: Security Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run Security Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node agents/security.js

# ── Analyst ───────────────────────────────────────────────────────────────────
# Runs every Monday at 08:00 UTC.
# Sends weekly analytics reports for all delivered clients.
  analyst:
    name: Analyst Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Analyst Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node agents/analyst.js
