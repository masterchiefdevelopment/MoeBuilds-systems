# MoeBuilds Agent Pipeline
#
# Trigger architecture
# ────────────────────
# Pipeline jobs (builder / auditor / qa) are triggered via GitHub's
# workflow_dispatch API, which Supabase Edge Functions call whenever a row
# changes status.  Schedule jobs (security / analyst) fire on cron.
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   SUPABASE_URL       — Supabase project URL
#   SUPABASE_ANON_KEY  — Supabase anon/public key
#   ANTHROPIC_API_KEY  — Anthropic API key (builder / auditor / analyst)
#   RESEND_API_KEY     — Resend API key (qa / security / analyst)
#   GH_PAT             — GitHub Personal Access Token (cross-repo access)
#   GH_OWNER           — Target repo owner  (e.g. masterchiefdevelopment)
#   GH_REPO            — Target repo name   (e.g. moe-builds-co)

name: MoeBuilds Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID to process'
        required: false
        default: ''
      action:
        description: 'Action to run: build | audit | qa'
        required: true
        default: 'build'
  schedule:
    - cron: '0 0 * * *'   # security — daily at midnight UTC
    - cron: '0 8 * * 1'   # analyst  — every Monday at 08:00 UTC

# ── Builder ──────────────────────────────────────────────────────────────────
# Triggered by the trigger-builder Supabase Edge Function when a client row
# is inserted with status = 'new'.  Requires inputs.client_id.
jobs:
  builder:
    name: Builder Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Builder Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/builder.js ${{ github.event.inputs.client_id }}

# ── Auditor ───────────────────────────────────────────────────────────────────
# Triggered by the trigger-auditor Supabase Edge Function when a client row
# status changes to 'auditing'.  Picks the oldest queued record automatically.
  auditor:
    name: Auditor Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'audit'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auditor Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/auditor.js

# ── QA ────────────────────────────────────────────────────────────────────────
# Triggered by the trigger-qa Supabase Edge Function when a client row
# status changes to 'qa'.  Picks the oldest queued record automatically.
  qa:
    name: QA Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'qa'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run QA Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          GH_OWNER:          ${{ secrets.GH_OWNER }}
          GH_REPO:           ${{ secrets.GH_REPO }}
        run: node agents/qa.js

# ── Security ──────────────────────────────────────────────────────────────────
# Runs daily at midnight UTC.
# Probes all delivered client URLs with Playwright and checks for stuck agents.
  security:
    name: Security Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run Security Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node agents/security.js

# ── Analyst ───────────────────────────────────────────────────────────────────
# Runs every Monday at 08:00 UTC.
# Sends weekly analytics reports for all delivered clients.
  analyst:
    name: Analyst Agent
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Analyst Agent
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node agents/analyst.js
